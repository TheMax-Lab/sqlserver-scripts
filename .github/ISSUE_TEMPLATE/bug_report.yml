name: Bug report
description: Report an incorrect result, compatibility problem, or unsafe recommendation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: script
    attributes:
      label: Script
      description: Which SQL file is affected?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SQL Server version
      placeholder: "Example: SQL Server 2022 CU..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Remove credentials, customer data and sensitive SQL text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
